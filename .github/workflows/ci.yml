name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodloom
          POSTGRES_PASSWORD: moodloom_dev
          POSTGRES_DB: moodloom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moodloom" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://moodloom:moodloom_dev@localhost:5432/moodloom_test
      - name: Known vulnerabilities in dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --omit=dev --audit-level=high

# Render blueprint: one web service (API + web app), a Postgres database and
# a disk for uploaded files. See docs/DEPLOYMENT.md before using it.
services:
  - type: web
    name: moodloom
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moodloom-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: ENFORCE_PLAN_LIMITS
        value: "true"
      # Set these four by hand in the dashboard once you know the address:
      - key: APP_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: moodloom-db
    plan: basic-256mb

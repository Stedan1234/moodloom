<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moodloom</title>
    <style>
      :root { --wall: #e7e9e5; --paper: #fcfcfa; --ink: #16201d; --mute: #5c6762; --line: #c9cec7; --spruce: #17332d; --weld: #f0b90b; --weld-soft: #fbe9a9; --madder: #b83f27; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 340px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--wall); }
      header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
      .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
      main { padding: 4px 14px 14px; }
      label { display: block; font-weight: 600; font-size: 12.5px; margin: 10px 0 4px; }
      input, select, textarea { width: 100%; font: inherit; color: inherit; background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--spruce); box-shadow: 0 0 0 3px rgba(23, 51, 45, 0.12); }
      textarea { resize: vertical; min-height: 54px; }
      button { font: inherit; cursor: pointer; border-radius: 8px; border: 1.5px solid transparent; padding: 8px 12px; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .primary { background: var(--spruce); color: var(--paper); width: 100%; margin-top: 12px; }
      .primary:hover:not(:disabled) { background: #2b5247; }
      .link { background: none; border: 0; padding: 0; color: var(--mute); text-decoration: underline; font-weight: 400; font-size: 12.5px; }
      .page { background: var(--paper); border-radius: 6px; padding: 8px 10px; box-shadow: 0 1px 0 rgba(22, 32, 29, 0.06), 0 2px 6px rgba(22, 32, 29, 0.07); }
      .page b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .page span { display: block; color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hint { color: var(--mute); font-size: 12.5px; margin: 6px 0 0; }
      .status { margin-top: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
      .status.ok { background: var(--weld-soft); }
      .status.error { background: #f6dcd5; color: #7a2413; }
      .code { letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; font-size: 17px; text-align: center; }
      [hidden] { display: none !important; }
      :focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">
        <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 16C6 6 10 6 16 16s10 10 14 0" fill="none" stroke="#f0b90b" stroke-width="4.2" stroke-linecap="round"/><g stroke="#17332d" stroke-width="4.2" stroke-linecap="round"><path d="M8 4v8.2M8 19.5V28M16 4v24M24 4v8.5M24 19.8V28"/></g><path d="M12.6 10.4c1.2 1.6 2.2 3.4 3.4 5.6s2.3 4 3.5 5.6" fill="none" stroke="#f0b90b" stroke-width="4.2"/></svg>
        moodloom
      </span>
      <button id="disconnect" class="link" hidden>Disconnect</button>
    </header>
    <main>
      <!-- Pairing: shown until this browser is linked to an account -->
      <form id="pairing" hidden>
        <p class="hint" style="margin-top: 0">In Moodloom, open <b>Account → Browser extension</b> and get a pairing code. Type it here to link this browser to your account.</p>
        <label for="code">Pairing code</label>
        <input id="code" class="code" maxlength="8" autocomplete="off" spellcheck="false" required />
        <label for="server">Moodloom address</label>
        <input id="server" placeholder="http://localhost:3001" autocomplete="off" spellcheck="false" />
        <p class="hint">Leave as it is if Moodloom runs on this computer.</p>
        <button class="primary" id="pair-button">Link this browser</button>
      </form>

      <!-- Capture: the page in front of you, into a project -->
      <form id="capture" hidden>
        <div class="page"><b id="page-title"></b><span id="page-url"></span></div>
        <label for="project">Project</label>
        <select id="project"></select>
        <input id="new-project" placeholder="Name the new project" maxlength="120" hidden style="margin-top: 6px" />
        <label for="category">Thread</label>
        <select id="category"></select>
        <label for="note">Why you’re saving it (optional)</label>
        <textarea id="note" maxlength="5000"></textarea>
        <button class="primary" id="save-button">Save to board</button>
        <p class="hint">Right-click any image or link and choose “Save to Moodloom” to send it to this project without opening this.</p>
      </form>

      <div id="status" class="status" role="status" hidden></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
